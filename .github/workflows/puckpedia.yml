name: PuckPedia caps (one-off)
on:
  push:
    branches: [main]
    paths: ["data/puckpedia-request.json"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/puckpedia.py
      - run: |
          git config user.name "Slapshot bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puckpedia.json data/puckpedia-raw.html || true; git add data/puckpedia.json
          git commit -m "PuckPedia caps" || exit 0
          git pull --rebase -q origin main && git push
