name: Daily site update

on:
  schedule:
    - cron: "53 8 * * *"    # 4:53am ET (EDT). In winter (EST) this runs at 3:53am.
    # Backups: GitHub sometimes drops scheduled runs. Re-runs are safe (the script skips work already done).
    - cron: "37 9 * * *"    # 5:37am ET (EDT)
    - cron: "17 10 * * *"   # 6:17am ET (EDT)
    - cron: "7 11 * * *"    # 7:07am ET (EDT)
  push:
    branches: [main]
    paths: ["data/run-now.txt"]   # edit this file to force a morning run
  workflow_dispatch:
    inputs:
      mode:
        description: "morning (results + new game day + lines) or evening (lines only)"
        default: morning
        type: choice
        options: [morning, evening]

permissions:
  contents: write
  pages: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update data.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}";
          elif [ "${{ github.event_name }}" = "push" ]; then MODE=morning;
          else MODE=morning; fi
          python scripts/update.py "$MODE" > result.txt 2>&1 || echo "FAILED: $(tail -1 result.txt)" >> result.txt; cat result.txt

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, datetime, zoneinfo, os
          r = open("result.txt").read().strip() if os.path.exists("result.txt") else "FAILED: update script did not run"
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          json.dump({"date": now.strftime("%Y-%m-%d"), "time": now.strftime("%H:%M ET"), "event": "${{ github.event_name }}", "result": r},
                    open("data/last-run.json", "w"), indent=1)
          PY
          git config user.name "Slapshot bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data/last-run.json
          git commit -m "Site update: $(cat result.txt 2>/dev/null || echo FAILED)"
          git pull --rebase -q origin main
          git push
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
          echo "Uploaded to GitHub."

      - name: Flag failures
        if: always()
        run: |
          cat result.txt
          if grep -q FAILED result.txt; then echo "::error::$(cat result.txt)"; exit 1; fi
