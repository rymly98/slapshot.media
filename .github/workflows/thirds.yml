name: Thirds (one-off)
on:
  push:
    branches: [main]
    paths: ["data/thirds-request.json"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/thirds.py
      - run: |
          git config user.name "Slapshot bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thirds-2025-26.json
          git commit -m "Thirds 2025-26" || exit 0
          git pull --rebase -q origin main && git push
